[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-ai-service"
version = "0.1.0"
description = "Smart Parking AI service scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "grpcio==1.84.0",
    "grpcio-health-checking==1.84.0",
    "grpcio-reflection==1.84.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-grpc==0.66b0",
    "opentelemetry-instrumentation-system-metrics==0.66b0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
