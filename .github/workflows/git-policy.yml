name: Git Policy

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  naming:
    name: Git Policy / Branch & Commit Naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Git policy rules
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate branch, PR title, and new commits
        env:
          POLICY_HEAD_BRANCH: ${{ github.head_ref }}
          POLICY_PR_TITLE: ${{ github.event.pull_request.title }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Historical commits before policy adoption are preserved.
          POLICY_CUTOVER_UTC: "2026-10-06T01:41:50Z"
        run: python scripts/ci/check_git_policy.py
