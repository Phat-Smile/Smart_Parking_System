name: Foundation CI

on:
  push:
    branches:
      - develop
      - 'features/**'
  pull_request:
    branches:
      - develop
      - 'features/**'

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore ParkingSystem.slnx
      - run: dotnet build ParkingSystem.slnx --no-restore
      - run: dotnet test ParkingSystem.slnx --no-build

  ai:
    name: AI foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/ai-service/requirements.lock
      - name: Install locked dependencies
        working-directory: ai/ai-service
        run: python -m pip install -r requirements.lock
      - name: Run AI tests
        working-directory: ai/ai-service
        run: python -m unittest discover -s tests -v
