name: Foundation CI

on:
  push:
    branches:
      - develop
      - "features/**"
  pull_request:
    branches:
      - develop
      - "features/**"

permissions:
  contents: read

jobs:
  dotnet-test:
    name: .NET / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Identity"
            project: "tests/Identity/Identity.UnitTests/Identity.UnitTests.csproj"
          - name: "Parking"
            project: "tests/Parking/Parking.UnitTests/Parking.UnitTests.csproj"
          - name: "Booking"
            project: "tests/Booking/Booking.UnitTests/Booking.UnitTests.csproj"
          - name: "Payment"
            project: "tests/Payment/Payment.UnitTests/Payment.UnitTests.csproj"
          - name: "Notification"
            project: "tests/Notification/Notification.UnitTests/Notification.UnitTests.csproj"
          - name: "Architecture"
            project: "tests/ArchitectureTests/ArchitectureTests.csproj"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Service
        run: dotnet build ${{ matrix.project }} -m:1 --disable-build-servers
      - name: Run Tests
        run: dotnet test --project ${{ matrix.project }} --no-build

  ai:
    name: AI / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/ai-service/requirements.lock
      - name: Install locked dependencies
        working-directory: ai/ai-service
        run: python -m pip install -r requirements.lock
      - name: Run AI tests
        working-directory: ai/ai-service
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend / Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
