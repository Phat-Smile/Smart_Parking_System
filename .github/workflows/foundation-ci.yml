name: Foundation CI

on:
  push:
    branches:
      - develop
      - "features/**"
  pull_request:
    branches:
      - develop
      - "features/**"

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET / Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet tool restore
      - run: dotnet restore ParkingSystem.slnx -m:1 --disable-build-servers
      - run: dotnet build ParkingSystem.slnx --no-restore -m:1 --disable-build-servers
      - name: Run Unit & Architecture Tests
        run: |
          dotnet test tests/Identity/Identity.UnitTests/Identity.UnitTests.csproj --no-build
          dotnet test tests/Parking/Parking.UnitTests/Parking.UnitTests.csproj --no-build
          dotnet test tests/Booking/Booking.UnitTests/Booking.UnitTests.csproj --no-build
          dotnet test tests/Payment/Payment.UnitTests/Payment.UnitTests.csproj --no-build
          dotnet test tests/Notification/Notification.UnitTests/Notification.UnitTests.csproj --no-build
          dotnet test tests/ArchitectureTests/ArchitectureTests.csproj --no-build
      - name: Generate Test Summary
        if: always()
        run: |
          echo "### 🧪 .NET Unit & Architecture Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service Project | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Identity.UnitTests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Parking.UnitTests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Booking.UnitTests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Payment.UnitTests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Notification.UnitTests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| ArchitectureTests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  ai:
    name: AI / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/ai-service/requirements.lock
      - name: Install locked dependencies
        working-directory: ai/ai-service
        run: python -m pip install -r requirements.lock
      - name: Run AI tests
        working-directory: ai/ai-service
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend / Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
