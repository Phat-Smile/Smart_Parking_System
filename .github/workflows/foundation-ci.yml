name: Foundation CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  dotnet-test:
    name: .NET / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Identity"
            projects: "tests/Identity/Identity.UnitTests/Identity.UnitTests.csproj"
          - name: "Parking"
            projects: "tests/Parking/Parking.UnitTests/Parking.UnitTests.csproj"
          - name: "Booking"
            projects: "tests/Booking/Booking.UnitTests/Booking.UnitTests.csproj"
          - name: "Payment"
            projects: "tests/Payment/Payment.UnitTests/Payment.UnitTests.csproj"
          - name: "Shared & Architecture"
            projects: "tests/ArchitectureTests/ArchitectureTests.csproj tests/Notification/Notification.UnitTests/Notification.UnitTests.csproj"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build Service
        run: |
          for proj in ${{ matrix.projects }}; do
            dotnet build "$proj" -m:1 --disable-build-servers
          done
      - name: Run Tests
        run: |
          for proj in ${{ matrix.projects }}; do
            dotnet test --project "$proj" --no-build
          done

  frontend:
    name: Frontend / Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build

  iot-simulator-tests:
    name: Python / IoT Simulator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: IoT simulator tests (no external broker)
        run: python -m unittest discover -s edge/iot-simulator/src -p 'test_*.py' -v
