syntax = "proto3";

package smartparking.parking.sessionfee.v1;

option csharp_namespace = "SmartParking.Contracts.Parking.SessionFee.V1";

// Contract 6, Parking part (master sheet, caller BE-5 Payment): what Payment needs to compute the fee of a session.
// Parking does not compute the fee and does not check the caller: Payment decides who may pay.
service ParkingSessionFeeContract {
  rpc GetSessionFeeContext(GetSessionFeeContextRequest)
      returns (GetSessionFeeContextResponse);
}

message GetSessionFeeContextRequest {
  // Canonical UUID "D" format (36 chars). Malformed -> INVALID_ARGUMENT.
  // Unknown session -> NOT_FOUND. No price list in force at entry -> FAILED_PRECONDITION.
  string session_id = 1;
}

message GetSessionFeeContextResponse {
  string session_id = 1;
  string lot_id = 2;
  string plate_number = 3;
  // Car or Motorbike.
  string vehicle_type = 4;
  // Active, Paid, Completed or Cancelled.
  string status = 5;
  // ISO 8601, UTC.
  string entry_time_utc = 6;
  // Booking, RegisteredWalkIn or UnregisteredWalkIn.
  string customer_type = 7;
  // Empty when the plate has no account.
  string account_id = 8;
  // Empty when the session has no reservation.
  string booking_id = 9;
  SessionPricing pricing = 10;
  // US-PAY-005 (BR-09.d), added fields. ISO 8601, UTC; empty when the session was never paid.
  string last_paid_at_utc = 11;
  // When the vehicle reached the exit gate in the current payment cycle; empty when it has not.
  string arrived_at_exit_utc = 12;
  // Exit window after a payment: 15, or 30 after the one-time staff extension.
  int32 grace_period_minutes = 13;
}

// BR-09.a: the price list in force when the vehicle entered, not the current one.
message SessionPricing {
  string policy_id = 1;
  // PerEntry or Block.
  string calculation_method = 2;
  // 0 for PerEntry.
  int32 block_minutes = 3;
  // VND: the price of one entry or one block.
  int64 price_per_unit = 4;
  // VND: fixed overnight fee of the price list (BR-09.b), 0 when none.
  int64 overnight_fee = 5;
}
