name: parking-system

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: Development

x-jwt-environment: &jwt-environment
  Security__Jwt__Issuer: ParkingSystem.Identity
  Security__Jwt__Audience: ParkingSystem
  Security__Jwt__PublicKeyPath: /run/parking-system/security/jwt/public.pem
  Security__Jwt__ClockSkewSeconds: "30"

x-jwt-public-key-volume: &jwt-public-key-volume
  - ./.local/security/jwt/public.pem:/run/parking-system/security/jwt/public.pem:ro

x-dotnet-service: &dotnet-service
  environment: *dotnet-environment
  volumes: *jwt-public-key-volume
  networks:
    - parking-network
  restart: unless-stopped

x-default-database-connection: &default-database-connection >-
  Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-parking_system};Username=${POSTGRES_USER:-parking_dev};Password=${POSTGRES_PASSWORD:-parking_dev_local_only};GSS Encryption Mode=Disable

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_system}
      POSTGRES_USER: ${POSTGRES_USER:-parking_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_dev_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - parking-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-parking_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
      - "127.0.0.1:${RABBITMQ_MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - parking-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5000}:8080"
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      Security__Cors__AllowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      ReverseProxy__Clusters__identity__Destinations__default__Address: http://identity-api:8080
      ReverseProxy__Clusters__parking__Destinations__default__Address: http://parking-api:8080
      ReverseProxy__Clusters__booking__Destinations__default__Address: http://booking-api:8080
      ReverseProxy__Clusters__payment__Destinations__default__Address: http://payment-api:8080
      ReverseProxy__Clusters__notification__Destinations__default__Address: http://notification-api:8080
      ASPNETCORE_HTTP_PORTS: 8080
      OTEL_SERVICE_NAME: parking-gateway
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    <<: *dotnet-service

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.WebAPI/Dockerfile
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-5001}:8080"
    expose:
      - "8081"
    <<: *dotnet-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_SERVICE_NAME: identity-api
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DOTNET_EXPERIMENTAL_ASPNETCORE_ENABLE_GRPC_INSTRUMENTATION: "true"
      ConnectionStrings__DefaultConnection: *default-database-connection
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__Username: ${RABBITMQ_USER:-parking_dev}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}

  parking-api:
    build:
      context: .
      dockerfile: src/Services/Parking/Parking.WebAPI/Dockerfile
    ports:
      - "127.0.0.1:${PARKING_PORT:-5002}:8080"
    expose:
      - "8081"
    <<: *dotnet-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_SERVICE_NAME: parking-api
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DOTNET_EXPERIMENTAL_ASPNETCORE_ENABLE_GRPC_INSTRUMENTATION: "true"
      ConnectionStrings__DefaultConnection: *default-database-connection
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__Username: ${RABBITMQ_USER:-parking_dev}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}

  booking-api:
    build:
      context: .
      dockerfile: src/Services/Booking/Booking.WebAPI/Dockerfile
    ports:
      - "127.0.0.1:${BOOKING_PORT:-5003}:8080"
    expose:
      - "8081"
    <<: *dotnet-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_SERVICE_NAME: booking-api
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DOTNET_EXPERIMENTAL_ASPNETCORE_ENABLE_GRPC_INSTRUMENTATION: "true"
      ConnectionStrings__DefaultConnection: *default-database-connection
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__Username: ${RABBITMQ_USER:-parking_dev}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}

  payment-api:
    build:
      context: .
      dockerfile: src/Services/Payment/Payment.WebAPI/Dockerfile
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-5004}:8080"
    expose:
      - "8081"
    <<: *dotnet-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_SERVICE_NAME: payment-api
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DOTNET_EXPERIMENTAL_ASPNETCORE_ENABLE_GRPC_INSTRUMENTATION: "true"
      ConnectionStrings__DefaultConnection: *default-database-connection
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__Username: ${RABBITMQ_USER:-parking_dev}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.WebAPI/Dockerfile
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-5005}:8080"
    expose:
      - "8081"
    <<: *dotnet-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *jwt-environment
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_SERVICE_NAME: notification-api
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_DOTNET_EXPERIMENTAL_ASPNETCORE_ENABLE_GRPC_INSTRUMENTATION: "true"
      ConnectionStrings__DefaultConnection: *default-database-connection
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      RabbitMq__Username: ${RABBITMQ_USER:-parking_dev}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}

  ai-service:
    build:
      context: .
      dockerfile: ai/ai-service/Dockerfile
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    expose:
      - "50051"
    environment:
      APP_ENVIRONMENT: Development
      AI_GRPC_PORT: 50051
      OTEL_SERVICE_NAME: ai-service
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=ParkingSystem,deployment.environment=Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - parking-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318"
    volumes:
      - ./deploy/observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - parking-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    command: ["--config", "/etc/jaeger/config.yml"]
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
    volumes:
      - ./deploy/observability/jaeger-config.yml:/etc/jaeger/config.yml:ro
    networks:
      - parking-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - parking-network
    restart: unless-stopped

  iot-simulator:
    build:
      context: .
      dockerfile: edge/iot-simulator/Dockerfile
    environment:
      MQTT_HOST: ${RABBITMQ_HOST:-rabbitmq}
      MQTT_PORT: ${RABBITMQ_MQTT_PORT:-1883}
      MQTT_USERNAME: ${RABBITMQ_USER:-parking_dev}
      MQTT_PASSWORD: ${RABBITMQ_PASSWORD:-parking_dev_local_only}
      DEVICE_SIMULATION_ENABLED: ${DEVICE_SIMULATION_ENABLED:-false}
    networks:
      - parking-network
    restart: unless-stopped

networks:
  parking-network:
    name: parking-network
    driver: bridge

volumes:
  postgres_data:
    name: parking_postgres_data
  rabbitmq_data:
    name: parking_rabbitmq_data

